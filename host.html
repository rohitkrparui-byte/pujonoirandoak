<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pujo Secret Society | Host</title><style>
*{box-sizing:border-box}body{margin:0;background:#10120e;color:#f5efe3;font:15px Arial}.wrap{max-width:1100px;margin:4vh auto;padding:20px}.panel{background:#f5efe3;color:#211e19;padding:22px;border-top:5px solid #c9a45d;margin-bottom:16px}h1{font:40px Georgia}h2{font:25px Georgia}input,textarea,button{font:inherit;padding:11px;margin:5px 0}input,textarea{width:100%;border:1px solid #c9b99d}button{background:#10251d;color:white;border:0;cursor:pointer}.red{background:#74191e}.hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.team,.answer{background:#fffaf0;padding:12px;margin:8px 0;border:1px solid #ddd0b8;color:#201d18}.status{color:#176b43;min-height:22px}.hint{font-size:13px;color:#675f55}.question{background:#fffaf0;border:1px solid #ddd0b8;padding:14px;margin:10px 0;color:#201d18}.timer{font-weight:bold;color:#74191e}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style><div class="wrap"><div class="panel"><h1>Pujo Secret Society · Host Console</h1><p class="hint">Private page. Set HOST_ACCESS_KEY in Netlify environment variables.</p><input id="key" type="password" placeholder="Host access key"><button id="connect">Connect</button><p id="status" class="status"></p></div><main id="console" class="hidden"><div class="panel"><h2>Session</h2><input id="session" value="Pujo Secret Society · Live"><button id="create">Create / reset session</button> <button id="start" >Start automatic game</button> <button id="next">Next question</button> <button id="reveal" class="red">Reveal / close question</button> <button id="finish" class="red">Finish game</button> <button id="refresh">Refresh</button><p class="hint">Start automatic game loads the preloaded questionnaire. Keep this host page open for the timed rounds.</p></div><div class="panel"><h2>Live question</h2><div id="current" class="question">Waiting to start.</div><div id="countdown" class="timer"></div><div id="progress" class="hint"></div></div><div class="grid"><div class="panel"><h2>Approved couples · scores</h2><div id="teams"></div></div><div class="panel"><h2>Answers</h2><div id="answers"></div></div></div></main></div><script>
const $=id=>document.getElementById(id);let key="",teams=[],state=null,questions=[],timer=null,advancing=false;
async function api(action,extra={}){const r=await fetch("/.netlify/functions/game-api",{method:"POST",headers:{"Content-Type":"application/json","x-host-key":key},body:JSON.stringify({action,...extra})});const d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d}
async function run(f){try{await f();$("status").textContent="Updated successfully."}catch(e){$("status").textContent=e.message}}
$("connect").onclick=()=>{key=$("key").value;run(async()=>{$("console").classList.remove("hidden");await refresh();if(timer)clearInterval(timer);timer=setInterval(tick,1000)})};
$("create").onclick=()=>run(async()=>{if(!confirm("Create/reset the session? This resets the current round state."))return;await api("create_session",{session_name:$("session").value});await refresh()});
$("start").onclick=()=>run(async()=>{if(!confirm("Start the 20-question automatic game now?"))return;await api("start_game");await refresh()});
$("next").onclick=()=>run(async()=>{await api("next_question");await refresh()});
$("reveal").onclick=()=>run(async()=>{await api("reveal");await refresh()});$("finish").onclick=()=>run(async()=>{await api("finish");await refresh()});$("refresh").onclick=()=>run(refresh);
async function refresh(){const d=await api("host_state");state=d.state;teams=d.teams||[];questions=d.questions||[];$("teams").innerHTML=teams.map(t=>`<div class="team"><b>${esc(t.name)} &amp; ${esc(t.partner)}</b><br>Score: ${t.points}<div style="display:flex;gap:5px;flex-wrap:wrap"><input id="p${t.id}" type="number" value="1" style="width:75px"><input id="n${t.id}" value="Host award" style="flex:1;min-width:100px"><button onclick="award('${t.id}')">Award</button></div></div>`).join("")||"No approved applications yet.";const names=Object.fromEntries(teams.map(t=>[t.id,t.name+" & "+t.partner]));$("answers").innerHTML=(d.answers||[]).map(a=>`<div class="answer"><b>${esc(names[a.application_id]||"Couple")} · Round ${a.round_number}, Q${a.question_order}</b><p>${esc(a.answer)}</p><small>${new Date(a.submitted_at).toLocaleString()}</small></div>`).join("")||"No answers yet.";renderCurrent()}
function renderCurrent(){if(!state){$("current").textContent="No session.";return}const q=questions.find(x=>x.round_number===state.round_number&&x.question_order===state.question_order);$("current").innerHTML=`<small>${esc(q?.category||"Pujo Secret Society")} · Round ${state.round_number||0}/5 · Question ${state.question_order||0}/4 · ${esc(state.status)}</small><h3>${esc(state.prompt||"Waiting for host to start the game.")}</h3>`;$("progress").textContent=questions.length+" preloaded questions available.";tick()}
async function tick(){if(!state||state.status!=="live"||!state.deadline_at){$("countdown").textContent="";return}const remain=Math.max(0,Math.ceil((Date.parse(state.deadline_at)-Date.now())/1000));$("countdown").textContent=remain?`Time remaining: ${remain}s`:"Time is up — advancing…";if(remain===0&&!advancing){advancing=true;try{await api("next_question");await refresh()}catch(e){$("status").textContent=e.message}finally{advancing=false}}}
async function award(id){await run(async()=>{await api("score",{application_id:id,points:Number($("p"+id).value),note:$("n"+id).value});await refresh()})}function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
</script></html>
