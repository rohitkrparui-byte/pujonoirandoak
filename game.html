<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pujo Secret Society | Player</title><style>
*{box-sizing:border-box}body{margin:0;background:#10120e;color:#f5efe3;font:16px Arial}.wrap{max-width:760px;margin:6vh auto;padding:20px}.card{background:#f5efe3;color:#211e19;padding:28px;border-top:5px solid #c9a45d}.eyebrow{letter-spacing:.2em;color:#a47c35;font-size:12px;font-weight:bold}h1{font:44px Georgia;margin:12px 0}input,button,textarea{width:100%;padding:14px;margin:7px 0;font:inherit}input,textarea{border:1px solid #c9b99d}button{background:#10251d;color:white;border:0;cursor:pointer}.hidden{display:none}.muted{color:#6d665d}.status{min-height:24px;color:#176b43}.prompt{font:28px Georgia;line-height:1.35}.pill{display:inline-block;background:#e8dcc4;padding:6px 10px;border-radius:20px;margin:5px 0}.timer{font-weight:bold;color:#74191e}
</style><div class="wrap"><div class="card"><div class="eyebrow">NOIR & OAK STAYS · PRIVATE GAME</div><h1>Pujo Secret Society</h1><p class="muted">Enter your couple’s invitation code to join the live game.</p><form id="join"><input id="code" maxlength="10" placeholder="10-character invitation code" required><button>Join Live Game</button></form><section id="play" class="hidden"><span class="pill" id="team"></span><span class="pill" id="score"></span><p class="muted" id="roundStatus"></p><h2 class="prompt" id="prompt">Waiting for host…</h2><div class="timer" id="timer"></div><form id="answer" class="hidden"><textarea id="response" rows="4" placeholder="Your couple’s answer"></textarea><button id="send">Submit Answer</button></form><p class="status" id="msg"></p></section><p class="status" id="err"></p></div></div><script>
const $=id=>document.getElementById(id);let code="",lastRound=null,lastOrder=null,interval=null;
async function api(action,extra={}){const r=await fetch("/.netlify/functions/game-api",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,code,...extra})});const d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d}
$("join").onsubmit=async e=>{e.preventDefault();code=$("code").value.trim().toUpperCase();$("err").textContent="Checking invitation…";try{const d=await api("join");$("team").textContent=d.team.name+" & "+d.team.partner;$("join").classList.add("hidden");$("play").classList.remove("hidden");$("err").textContent="";await refresh();interval=setInterval(refresh,2000)}catch(x){$("err").textContent=x.message}};
async function refresh(){try{const d=await api("player_state"),s=d.state;$("score").textContent="Score: "+d.points;$("roundStatus").textContent=s?"Session: "+s.session_name+" · "+s.status+" · Round "+s.round_number+"/5 · Question "+s.question_order+"/4":"Waiting for host";$("prompt").textContent=s?.prompt||"The host will begin shortly.";const live=s?.status==="live";$("answer").classList.toggle("hidden",!live);if(s?.round_number!==lastRound||s?.question_order!==lastOrder){$("response").value="";$("send").disabled=false;lastRound=s?.round_number;lastOrder=s?.question_order;$("msg").textContent=""}if(d.lastAnswer&&d.lastAnswer.round_number===s?.round_number&&d.lastAnswer.question_order===s?.question_order){$("send").disabled=true;$("msg").textContent="Answer received for this question."}else if(!live){$("msg").textContent=s?.status==="finished"?"Game finished. Thank you for playing!":s?.status==="revealed"?"The host has closed this question. Please wait for the next one.":"Waiting for the host to begin…"}if(live&&s.deadline_at){const remain=Math.max(0,Math.ceil((Date.parse(s.deadline_at)-Date.now())/1000));$("timer").textContent=remain?"Time remaining: "+remain+" seconds":"Time is up. Waiting for the next question…"}else $("timer").textContent=""}catch(x){$("msg").textContent=x.message}}
$("answer").onsubmit=async e=>{e.preventDefault();$("send").disabled=true;try{const d=await api("submit_answer",{answer:$("response").value});$("msg").textContent=d.message}catch(x){$("msg").textContent=x.message;$("send").disabled=false}};
const params=new URLSearchParams(location.search),prefill=params.get("code");if(prefill){$("code").value=prefill;$("join").requestSubmit()}
</script></html>
